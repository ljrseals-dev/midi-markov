[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-gen-service"
version = "0.1.0"
description = "Hierarchical Markov-based symbolic MIDI generation service"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MIDI Gen Contributors"}]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "arq>=0.26.1",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "symusic>=0.6.0",
    "mido>=1.3.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
